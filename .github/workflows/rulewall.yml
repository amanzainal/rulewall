name: rulewall

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rulewall
        run: pip install .

      # Install your real dependencies here so rulewall has a tree to scan, e.g.
      #   - run: npm ci
      #   - run: pip install -r requirements.txt

      - name: Scan dependency tree for poisoned rule-files
        # Emit SARIF for code scanning even when findings exist (continue),
        # then fail the job on findings in a later step.
        run: rulewall . --sarif rulewall.sarif --format human
        continue-on-error: true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rulewall.sarif

      - name: Fail if poisoned rule-files were found
        run: rulewall . --fail-on warning
