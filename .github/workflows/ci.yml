name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync
      - run: uv run pytest -q
      # Non-gating showcase: --demo scans a synthesized poisoned tree and
      # intentionally exits non-zero when it finds planted rule-files (that is
      # the tool working). Keep it informational so it never reds the run.
      - run: uv run rulewall --demo || true
