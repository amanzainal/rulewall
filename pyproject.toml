[project]
name = "rulewall"
version = "0.1.0"
description = "Scan your installed dependency tree for poisoned AI-agent rule-files (CLAUDE.md / .cursorrules) planted by malicious packages."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Aman Zainal", email = "aman@u.nus.edu" }
]
keywords = [
    "security",
    "supply-chain",
    "ai-agent",
    "prompt-injection",
    "claude",
    "cursor",
    "sarif",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AmanZainal/rulewall"
Repository = "https://github.com/AmanZainal/rulewall"
Issues = "https://github.com/AmanZainal/rulewall/issues"

[project.scripts]
rulewall = "rulewall.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
